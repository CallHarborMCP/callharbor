name: Required
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  required:
    name: required
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release tag ancestry checks must work from CI
      - uses: jdx/mise-action@v5
      - name: Run standard product tests
        run: mise exec -- bash scripts/verify-local.sh
      # Feature PRs must add actual reproducible product tests to verify-local.sh.
      # Telnyx calls and paid AI are never used in CI.
